[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "docdrift"
version = "0.1.0"
description = "Keep requirements, ADRs, code, tests, and documentation aligned throughout the SDLC."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  {name = "Paulo Tavares"},
]
keywords = [
  "documentation",
  "fine-tuning",
  "gemma",
  "machine-learning",
  "sdlc",
  "software-engineering",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Documentation",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "pyyaml>=6,<7",
  "ruff>=0.9,<1",
]
training = [
  "accelerate>=1.2",
  "bitsandbytes>=0.50,<1; platform_system == 'Linux'",
  "datasets>=3.2",
  "peft>=0.14",
  "transformers>=5.10.1",
  "trl>=0.13",
]
mac-training = [
  "huggingface-hub>=1,<2",
  "mlx-lm>=0.31,<0.32; platform_system == 'Darwin' and platform_machine == 'arm64'",
  "psutil>=7,<8",
  "pyyaml>=6,<7",
]

[project.urls]
Homepage = "https://github.com/paulotvlincelia/docdrift"
Documentation = "https://github.com/paulotvlincelia/docdrift/tree/main/docs"
Issues = "https://github.com/paulotvlincelia/docdrift/issues"

[project.scripts]
docdrift = "docdrift.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/docdrift"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "docdrift_contracts"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "gemma-documentation-synchronizer"
version = "0.1.0"
description = "Dataset, fine-tuning and runtime contracts for an SDLC documentation synchronizer based on Gemma 4 E2B."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]
training = [
  "accelerate>=1.2",
  "datasets>=3.2",
  "peft>=0.14",
  "transformers>=5.10.1",
  "trl>=0.13",
]

[project.scripts]
gemma-doc-sync = "gemma_doc_sync.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gemma_doc_sync"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "gemma_doc_sync_contracts"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# Fast compatibility check for Apple Silicon. This is not a production recipe.
model: mlx-community/gemma-4-e2b-it-4bit
train: true
fine_tune_type: lora
data: examples/training-smoke
seed: 42

num_layers: 4
batch_size: 1
iters: 5
val_batches: 1
learning_rate: 0.00001
steps_per_report: 1
steps_per_eval: 2
grad_accumulation_steps: 1
save_every: 5
max_seq_length: 512
grad_checkpoint: true
mask_prompt: true

adapter_path: artifacts/mlx-smoke/adapters
lora_parameters:
  rank: 4
  dropout: 0.0
  scale: 8.0

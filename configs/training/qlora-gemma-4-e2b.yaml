experiment_name: gemma-4-e2b-change-episode-sft
status: draft

model:
  id: google/gemma-4-E2B-it
  revision: null  # Pin before the first reproducible run.
  trust_remote_code: false
  torch_dtype: bfloat16
  quantization:
    enabled: true
    bits: 4
    quant_type: nf4
    double_quant: true

task:
  modes:
    - analyze_documentation_impact
    - generate_documentation_patch
  max_sequence_length: 8192
  train_on_prompt: false

lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules: auto  # Resolve after checkpoint inspection; store resolved config per run.

training:
  seed: 42
  epochs: 3
  learning_rate: 0.0002
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  gradient_checkpointing: true
  bf16: true
  logging_steps: 10
  evaluation_strategy: steps
  eval_steps: 100
  save_steps: 100

selection:
  primary_metric: impact_macro_f1
  greater_is_better: true
  reject_on_critical_grounding_failure: true

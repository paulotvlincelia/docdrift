version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
    # Quiet mode: routine version-update PRs are disabled. Dependabot security
    # updates remain controlled independently by the repository security settings.
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
    # Review action upgrades deliberately instead of receiving routine PRs.
    open-pull-requests-limit: 0

version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      core-python:
        patterns:
          - jsonschema
          - pytest
          - pyyaml
          - ruff
          - hatchling
      cuda-training:
        patterns:
          - accelerate
          - bitsandbytes
          - datasets
          - peft
          - transformers
          - trl
      apple-silicon-training:
        patterns:
          - huggingface-hub
          - mlx-lm
          - psutil
    labels:
      - dependencies
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - dependencies
    open-pull-requests-limit: 1

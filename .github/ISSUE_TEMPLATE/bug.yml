name: Bug report
description: Report a reproducible problem in DocDrift code, schemas, examples, or documentation.
title: "bug: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve DocDrift. Remove secrets and proprietary material before submitting.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and why it is incorrect.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest reproducible example, commands, and relevant revisions.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: DocDrift revision
      placeholder: Commit SHA, tag, or branch
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python, hardware, and dependency versions when relevant.
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues and Discussions.
          required: true
        - label: I removed secrets, proprietary content, and unnecessary personal data.
          required: true

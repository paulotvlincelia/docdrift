title: "[Show and tell] "
labels: [show-and-tell]
body:
  - type: markdown
    attributes:
      value: Show how you are studying, extending, or applying documentation continuity.
  - type: textarea
    id: project
    attributes:
      label: What did you build or learn?
    validations:
      required: true
  - type: textarea
    id: connection
    attributes:
      label: How does it connect to DocDrift?
    validations:
      required: true
  - type: textarea
    id: links
    attributes:
      label: Links, screenshots, datasets, or results
  - type: textarea
    id: feedback
    attributes:
      label: What feedback would help?
